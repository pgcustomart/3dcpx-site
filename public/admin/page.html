<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de página — Painel 3DCPX</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar__left">
      <a href="index.html" class="topbar__back">← Páginas</a>
      <span class="topbar__title" id="pageTitle">Carregando...</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn--sm" id="previewBtn">Preview ↗</button>
      <button class="btn btn--sm" id="logoutBtn">Sair</button>
    </div>
  </div>

  <div class="container">
    <div class="page-header-row">
      <h1>Blocos da página</h1>
      <button class="btn btn--primary btn--sm" id="addBlockBtn">+ Adicionar bloco</button>
    </div>
    <div id="blockList" class="block-list loading">Carregando blocos...</div>
  </div>

  <!-- Painel lateral de edição -->
  <div class="overlay" id="overlay"></div>
  <div class="side-panel" id="sidePanel">
    <div class="side-panel__header">
      <h2 id="sidePanelTitle">Editar bloco</h2>
      <button class="close-x" id="closeSidePanel">✕</button>
    </div>
    <div class="side-panel__body" id="sidePanelBody"></div>
    <div class="side-panel__footer">
      <button class="btn btn--sm" id="cancelEditBtn">Cancelar</button>
      <button class="btn btn--primary btn--sm" id="saveBlockBtn">Salvar</button>
    </div>
  </div>

  <!-- Modal adicionar bloco -->
  <div class="modal-backdrop" id="addModalBackdrop">
    <div class="modal">
      <div class="modal__header">
        <h2 style="font-size:15px;margin:0;">Adicionar bloco</h2>
        <button class="close-x" id="closeAddModal">✕</button>
      </div>
      <div class="modal__body">
        <div class="type-grid" id="typeGrid"></div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="page.js"></script>
</body>
</html>
