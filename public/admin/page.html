<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de página — CMS 3DCPX</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <!-- Painel lateral de edição (mesma estrutura/ids de sempre — page.js depende deles) -->
  <div class="overlay" id="overlay"></div>
  <div class="side-panel" id="sidePanel">
    <div class="side-panel__header">
      <h2 id="sidePanelTitle">Editar bloco</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="sidePanelPublishBadge" title="Alterações salvas aqui vão ao ar imediatamente — não existe rascunho separado hoje."></span>
        <button class="close-x" id="closeSidePanel">✕</button>
      </div>
    </div>
    <div class="side-panel__body" id="sidePanelBody"></div>
    <div class="side-panel__footer">
      <div id="sidePanelSync" style="margin-right:auto;"></div>
      <button class="btn btn--sm" id="cancelEditBtn">Cancelar</button>
      <button class="btn btn--primary btn--sm" id="saveBlockBtn">Salvar</button>
    </div>
  </div>

  <!-- Modal adicionar bloco -->
  <div class="modal-backdrop" id="addModalBackdrop">
    <div class="modal">
      <div class="modal__header">
        <h2 style="font-size:15px;margin:0;">Adicionar bloco</h2>
        <button class="close-x" id="closeAddModal">✕</button>
      </div>
      <div class="modal__body">
        <div class="type-grid" id="typeGrid"></div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="icons.js"></script>
  <script src="components.js"></script>
  <script src="shell.js"></script>
  <script src="page.js"></script>
</body>
</html>
