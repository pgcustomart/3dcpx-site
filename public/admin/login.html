<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Painel 3DCPX</title>
  <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="login-card__logo" src="/assets/images/logo/logo-dark-bg.png" alt="3DCPX" width="88" height="44" />
      <h1>Painel administrativo</h1>
      <div class="error-banner" id="errorBanner"></div>
      <form id="loginForm">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;" id="submitBtn">Entrar</button>
      </form>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
